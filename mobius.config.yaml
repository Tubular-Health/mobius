# Mobius Configuration
# Copy to ~/.config/mobius/config.yaml and customize
#
# Environment variables override these settings:
#   MOBIUS_BACKEND, MOBIUS_DELAY_SECONDS, etc.

# Issue tracker backend: linear | jira | local
backend: linear

# Agent runtime: claude | opencode | both
# - claude: all tasks execute via Claude runtime
# - opencode: all tasks execute via OpenCode runtime
# - both: runtime is selected per model family (Claude-family -> claude, GPT-family -> opencode)
runtime: opencode

# Backend-specific settings
linear:
  # Workspace context - used by skills as defaults
  # team: Engineering
  # project: My Project
  # default_labels: [Bug, Feature, Improvement]

jira:
  # Uncomment and configure when using Jira backend:
  # base_url: https://yourcompany.atlassian.net
  # project_key: PROJ
  # auth_method: api_token  # api_token | oauth
  # default_labels: [bug, story, task]

# Execution settings
execution:
  # Seconds to wait between loop iterations
  delay_seconds: 3

  # Maximum iterations (0 = unlimited)
  max_iterations: 50

  # Model profile: opus | sonnet | haiku
  # Claude runtime uses this directly.
  # OpenCode runtime maps profiles to provider-qualified models (default: openai/gpt-5.3-codex).
  # This is the fallback model for legacy configs and `general` tasks when
  # `task_type_models` is not configured.
  model: openai/gpt-5.3-codex

  # Optional task-category model routing.
  # - `general` is required when this block is present.
  # - `frontend` and `backend` are optional and fall back to `general`.
  # - Runtime/model compatibility is validated at config load time (fail-fast).
  # task_type_models:
  #   general: sonnet
  #   frontend: opus
  #   backend: openai/gpt-5.3-codex

  # Fail-fast compatibility examples:
  # - If `runtime: claude`, GPT-family models fail with:
  #   "... incompatible with runtime 'claude' ... set runtime to 'opencode'/'both'."
  # - If `runtime: opencode`, Claude-family models fail with:
  #   "... incompatible with runtime 'opencode' ... set runtime to 'claude'/'both'."
  # - If `runtime: both`, unknown model families fail with:
  #   "... not recognized for runtime 'both' ... Use Claude-family ... or GPT-family ..."

  # Run in Docker sandbox by default (safer for autonomous execution)
  # Set to false or use --no-sandbox flag to run directly
  sandbox: true

  # Docker container name for sandbox mode
  container_name: mobius-sandbox

  # Parallel execution settings (for `mobius loop` command)

  # Maximum concurrent runtime agents for parallel sub-task execution (1-10)
  max_parallel_agents: 10

  # Base directory for git worktrees (<repo> replaced with repository name at runtime)
  worktree_path: "../<repo>-worktrees/"

  # Automatically remove worktree after successful loop completion
  cleanup_on_success: true

  # Branch to create feature branches from when starting a loop
  base_branch: "main"
